# The same checks as CI, with the tool versions pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
      - id: guard-no-workspace
        name: no campaign workspace or Source (LIC-10)
        entry: uv run python scripts/guard_no_workspace.py
        language: system
      - id: guard-sample-campaign
        name: original sample campaign (LIC-10, LIC-13)
        entry: uv run python scripts/guard_sample_campaign.py
        language: system
        pass_filenames: false
        files: ^(sample-campaign/|scripts/(guard_sample_campaign\.py|sample-setting-deny-list\.txt))
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/
      - id: zizmor
        name: zizmor
        entry: uv run zizmor --offline
        language: system
        files: ^\.github/workflows/
