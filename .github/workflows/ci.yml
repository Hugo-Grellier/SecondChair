name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked
      - name: ruff lint
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: ty
        run: uv run ty check
      - name: pytest
        run: uv run pytest

  javascript:
    name: Foundry modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Biome lint and format
        run: npx biome ci --reporter=github
      - name: tsc --checkJs
        run: npx tsc --project tsconfig.json
      - name: node --test
        run: node --test "foundry/**/*.test.js"

  guards:
    name: Guards and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv sync --locked
      - name: No campaign workspace or Source in the repository (LIC-10)
        run: uv run python scripts/guard_no_workspace.py
      - name: Original sample campaign (LIC-10, LIC-13)
        run: uv run python scripts/guard_sample_campaign.py
      - name: actionlint
        run: uv run actionlint
      - name: zizmor
        run: uv run zizmor --offline .github/workflows
