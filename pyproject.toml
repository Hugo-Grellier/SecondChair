[project]
name = "secondchair"
version = "0.1.0"
description = "Human-directed, AI-operated campaign director for tabletop GMs"
readme = "README.md"
license = "AGPL-3.0-only AND Apache-2.0"
license-files = ["LICENSE", "src/*/playbooks/LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
    "py3langid>=0.4.0",
    "pyyaml>=6.0.2",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
    "websockets>=15",
]

[project.scripts]
secondchair = "secondchair.cli:main"

[project.entry-points."secondchair.calendars"]
absalom = "secondchair_pf2e.calendar:ABSALOM"

[project.entry-points."secondchair.connectors"]
foundry = "secondchair_foundry.bridge:routes"

[project.entry-points."secondchair.playbooks"]
core = "secondchair.runner:PLAYBOOKS"
foundry = "secondchair_foundry:PLAYBOOKS"
pf2e = "secondchair_pf2e:PLAYBOOKS"

[project.entry-points."secondchair.rules_checks"]
pf2e = "secondchair_pf2e.checks:check"

[project.entry-points."secondchair.tools"]
core = "secondchair.core.campaign:BLOCK"
foundry = "secondchair_foundry.tools:BLOCK"
pf2e = "secondchair_pf2e.calculators:BLOCK"
pf2e-encounters = "secondchair_pf2e.tools:BLOCK"

[dependency-groups]
dev = [
    "actionlint-py",
    "jsonschema>=4.26.0",
    "pre-commit",
    "pytest",
    "ruff",
    "ty",
    "zizmor",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The Core, the PF2e System extension and the Foundry connector's Python half ship in the one
# `secondchair` distribution (PKG-17).
module-name = ["secondchair", "secondchair_pf2e", "secondchair_foundry"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
