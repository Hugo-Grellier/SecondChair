[project]
name = "secondchair"
version = "0.1.0"
description = "Human-directed, AI-operated campaign director for tabletop GMs"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
secondchair = "secondchair.cli:main"

[dependency-groups]
dev = [
    "actionlint-py",
    "pre-commit",
    "pytest",
    "ruff",
    "ty",
    "zizmor",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
